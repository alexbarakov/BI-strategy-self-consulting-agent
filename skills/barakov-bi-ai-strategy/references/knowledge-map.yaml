    kb: "30-graph.yaml → blocks[7]"

# Инструменты и источники companion-репозитория, полезные в любом блоке
cross_cutting:
  eval: "references/70-golden-set/   # голден-сет 3 уровней; правило: набор фиксируется до правок и не переформулируется под поиск"
  faq: "references/faq-participants.md   # 101 вопрос участников с ответами, размеченными по провенансу"
  kb_entry: "references/kb/30-graph.yaml   # блок → атомы; key_evidence — числа для защиты приоритетов"
  kb_always_read: [guide-structure, innovation-map, plausible-but-wrong, ai-time-saving-trap, participants-2026-benchmark]
  kb_internal_only: "атомы со списком internal_only в 30-graph.yaml содержат внутренние замеры — переносим конструкцию, не числа"
  workshop_templates: "12_templates/templates.md   # анализ болей, классификатор доменов, vision statement, канвасы"
  reading_library: "10_ai_era_themes/library.md"
  source_verification: "40_sources.md"
