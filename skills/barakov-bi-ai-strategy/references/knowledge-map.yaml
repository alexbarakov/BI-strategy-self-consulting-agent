    kb: "30-graph.yaml → blocks[5]"

  - id: 6
    title: "Операционная Основа"
    phase: to-be
    local: [strategy-template.md, evidence-2026.md]
    companion:
      - "10_ai_era_themes/skills-hub.md"
      - "11_dg_program_themes/roles-and-operating-model.md"
      - "11_dg_program_themes/maturity-and-metrics.md"
