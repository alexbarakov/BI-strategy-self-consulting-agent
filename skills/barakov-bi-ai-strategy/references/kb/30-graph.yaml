# Машиночитаемый граф базы знаний.
# Агент по номеру блока стратегии находит релевантные атомы.
# Аналог 30_graph/objects.yaml у companion-репозитория DG-strategy-self-consulting-agent:
# нумерация папок общая, один номер = одна роль в обоих репозиториях.

meta:
  skill: barakov-bi-ai-strategy
  triage: "50-failure-catalog.md   # вход «у нас что-то не так»: симптом → семейство → атом"
  numbers: "51-numbers.md          # каждая цифра с тегом надёжности; тег переносится вместе с числом"
  root: references/kb
  atoms: 66
  convention: "один файл = одна тема; связи через [[wiki-ссылки]]"

sources:
  - id: guide-2.0
    title: "BI Strategy & Tactics Guide 2.0"
    kind: spreadsheet
    author: DataNature
    url: "https://docs.google.com/spreadsheets/d/1thAW0TipIHBjxrnNWyVO0ztzkluFm-g8hgE6UqJloTo"
    covers: 11-method/*
  - id: miro-board
    title: "BI Strategy Guide 2.0 + BI Project Innovation Map"
    kind: miro
    url: "https://miro.com/app/board/o9J_lha8MnM=/"
    covers: 20-catalog/innovation-map.md
    note: "фрейм Guide 2.0 — визуальное зеркало таблицы; Innovation Map — уникальный каталог направлений"
  - id: course-2026
    title: "Курс «Разработка BI+AI стратегии 2026», 9 занятий"
    kind: slides
    covers: 10-ai-era/*
  - id: precourse-survey
    title: "Пре-курс опрос участников, n=12, июль–август 2026"
    kind: survey
    covers: 31-field/*
    note: "большинство респондентов разрешили раскрытие только в агрегированном виде"

# Порядок работы по методу: разделы гайда слева направо
method_spine:
  - {section: 1, phase: as-is,          atoms: [painpoints-analysis, data-domains-classification, user-classification, info-supply-demand, bi-adoption-stats]}
  - {section: 2, phase: to-be,          atoms: [data-mgmt-processes, critical-data-status, content-mgmt-processes, selfservice-practices, centralized-practices, bi-toolset-landscape]}
  - {section: 3, phase: operations,     atoms: [access-matrix, regular-meetings, rules-and-standards, onboarding-plan, bi-project-metrics]}
  - {section: 4, phase: transformation, atoms: [action-plan]}
  - {section: 5, phase: vision,         atoms: [vision-statement]}

blocks:
  - id: 1
    title: "Бизнес Основа"
    method: [painpoints-analysis, data-domains-classification, user-classification, info-supply-demand, bi-adoption-stats, vision-statement]
    course: [bi-value-illusion, bi-strategy-purpose, data-team-pain-points]
    field: [pain-fronts-2026, participants-2026-benchmark]

  - id: 2
    title: "Оценка D&A ландшафта"
    method: [info-supply-demand, bi-adoption-stats]
    course: [maturity-models, bi-adoption-barriers, data-utility-gap, ai-ready-domain-score, ai-in-data-processes, plausible-but-wrong]
    field: [participants-2026-benchmark, pain-fronts-2026]

  - id: 3
    title: "Целевая Операционная Модель"
    method: [user-classification]
    course: [ssbi-vs-guided, ssbi-failure-causes, ssbi-workflow, bi-org-structure, unified-bi-platform, nextgen-report-formats]

  - id: 4.1
    title: "Data Models Management"
    method: [data-mgmt-processes, critical-data-status, data-domains-classification, access-matrix]
    course: [core-layer-project, dg-launch-path, data-catalog-pitfalls, glossary-vs-dictionary, access-automation, ai-in-data-processes, data-team-pain-points]

  - id: 4.2
    title: "BI Report Management"
    method: [content-mgmt-processes, centralized-practices]
    course: [content-catalog-ux, content-certification, content-hygiene-loop, visual-style-guide, content-promotion-monitoring, nextgen-report-formats]

  - id: 4.3
    title: "Insight Management"
    method: [selfservice-practices, centralized-practices]
    course: [insight-management, ai-cases-in-prod, bi-community-management, domain-knowledge-base, centralized-bi-brand]

  - id: 5
    title: "Технологическая Основа"
    method: [bi-toolset-landscape, critical-data-status]
    course: [ai-triad-prerequisites, llm-assistant-architecture, domain-knowledge-base, context-governance, context-layer-market, semantic-layer-evidence, core-layer-project, bi-tool-selection, unified-bi-platform, ai-in-bi-approaches, ai-adoption-waves]

  - id: 6
    title: "Операционная Основа"
    method: [regular-meetings, rules-and-standards, onboarding-plan, bi-project-metrics, access-matrix]
    course: [bi-org-structure, bi-routine-calendar, bi-competency-matrix, bi-hiring-ai-era, bi-community-management, centralized-bi-brand, infra-billing, ai-accelerator]

  - id: 7
    title: "Управление изменениями"
    method: [action-plan, vision-statement]
    course: [dg-launch-path, ai-adoption-waves, ai-accelerator, ai-time-saving-trap, bi-hiring-ai-era, infra-billing]
    catalog: [innovation-map]

# Атомы, которые стоит прочитать всегда — независимо от блока
cross_cutting:
  - guide-structure          # спайн метода: без него непонятен порядок
  - innovation-map           # карта всех направлений: чеклист полноты
  - plausible-but-wrong      # главный риск, из которого выводятся все гейты
  - ai-time-saving-trap      # запрет мерить эффект сэкономленными часами
  - participants-2026-benchmark  # калибровка «а как у других»

# Числа, которые чаще всего нужны для защиты приоритетов
key_evidence:
  - {claim: "88% отчётов умирают за 3 месяца, 2% дают стабильный результат", atom: bi-value-illusion, confidence: проверяемо}
  - {claim: "медианное время жизни дашборда ~50 дней, при зрелых практиках 136", atom: bi-value-illusion, confidence: проверяемо}
  - {claim: "text-to-SQL на реальных enterprise-схемах ~40%; с семантическим слоем 85–95%", atom: semantic-layer-evidence, confidence: смешанная}
  - {claim: "парные замеры: 16,7% → 54,2% на корпоративной схеме из 199 таблиц", atom: semantic-layer-evidence, confidence: проверяемо}
  - {claim: "модель почти не влияет — reasoning effort не меняет точность, когда слой есть", atom: semantic-layer-evidence, confidence: проверяемо}
  - {claim: "accuracy доменного бота без базы знаний ~25%, с наполненной ~80%", atom: domain-knowledge-base, confidence: "проверяемо, внутренний замер"}
  - {claim: "context rot: заметная потеря точности уже на 50К токенов при окне 200К", atom: context-layer-market, confidence: проверяемо}
  - {claim: "описания от модели врут втрое чаще человека: 19,6% против 6,3%", atom: ai-in-data-processes, confidence: проверяемо}
  - {claim: "разработчики на 19% медленнее, будучи уверены, что на 20% быстрее", atom: ai-in-data-processes, confidence: проверяемо}
  - {claim: "20–40% доменов обеспечивают 60–85% use cases", atom: info-supply-demand, confidence: проверяемо}
  - {claim: "в 4 из 12 компаний выборки DG-команды нет вообще", atom: participants-2026-benchmark, confidence: "самоотчёт, n=12"}
  - {claim: "ни у одной компании выборки нет зрелого семантического слоя целиком", atom: participants-2026-benchmark, confidence: "самоотчёт, n=12"}

# Кейсы из практики: числовые пороги обезличены (порядок эффекта вместо точной цифры).
# Правило: конструкцию и механику переносим, пороги ставим от своего бейзлайна.
anonymized_cases:
  - ai-ready-domain-score
  - ai-cases-in-prod
  - core-layer-project
  - infra-billing
  - domain-knowledge-base
  - context-governance
  - ai-accelerator
  - bi-competency-matrix
  - bi-hiring-ai-era
  - unified-bi-platform
