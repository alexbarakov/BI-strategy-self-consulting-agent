# Голден-сет скилла barakov-bi-ai-strategy — уровень 2: качество ответа
#
# Что меряет: сказал ли агент то, что нужно, и НЕ сказал ли того, что нельзя.
# Оценивает LLM-судья по рубрике. Ведётся руками.
#
# Вопросы намеренно переформулированы ЯЗЫКОМ УЧАСТНИКА, а не языком базы знаний:
# сет должен проверять понимание, а не совпадение строк с FAQ.
#
# must_not — главное поле. Это конкретные неправильные ответы, которые база знаний
# опровергает явно. Ответ, содержащий любой пункт must_not, получает вердикт «неверно»
# независимо от того, сколько пунктов must_contain он закрыл.
#
# blind: true — позиция не показывается при разработке скилла, используется только на замере.

meta:
  tier: 2
  kind: answer_quality
  judge_verdicts: [верно_и_с_решением, верно_без_решения, неверно_или_выдумка]
  primary_metric: "доля «верно_и_с_решением»"
  secondary_metric: "доля «верно_и_с_решением» + «верно_без_решения»"
  hard_rule: "любое совпадение с must_not → неверно_или_выдумка"
  items: 32

items:

  # ---- AI-фундамент: самые дорогие ошибки ----

  - id: gs2-01
    question: "Мы решили делать AI-ассистента. Параллельно запускаем семантический слой, core-слой и базу знаний по домену, чтобы быстрее. Нормальный план?"
    expected_atoms: [ai-triad-prerequisites, core-layer-project]
    must_contain:
      - строить один слой за раз, а не параллельно
      - начинать с того слоя, который закрывает самую дорогую боль домена
      - eval до и после, чтобы видеть реальный прирост
    must_not:
      - параллельный запуск трёх слоёв назван нормальным
      - порядок сборки объявлен неважным
      - рекомендация начать с ассистента
    status: needs_review

  - id: gs2-02
    question: "Посчитали: AI сэкономил аналитикам 200 часов за квартал. Могу нести это руководству как эффект?"
    expected_atoms: [ai-time-saving-trap, bi-project-metrics]
    must_contain:
      - экономия времени у человека не равна выгоде компании
      - высвобожденное время растворяется без явного решения о ре-аллокейте
      - нужно назвать, кто принимает решение и куда идёт ресурс
    must_not:
      - да, это готовый эффект
      - достаточно умножить часы на стоимость часа
      - самооценка команды принята как доказательство
    blind: true
    status: needs_review

  - id: gs2-03
    question: "Пилот text-to-SQL на демо-схеме отработал отлично. Что может пойти не так на нашей реальной схеме?"
    expected_atoms: [plausible-but-wrong, semantic-layer-evidence]
    must_contain:
      - на игрушечной схеме маленькое пространство и очевидные джойны
      - в проде агент выдаёт синтаксически валидный, но неверный ответ
      - правдоподобный неверный ответ бьёт по доверию сильнее честного отказа
    must_not:
      - успех демо перенесён на прод без оговорок
      - проблема сведена к качеству промпта
      - обещана конкретная точность на схеме пользователя
    status: needs_review

  - id: gs2-04
    question: "Насколько семантический слой поднимет точность у нас? Хочу цифру для защиты бюджета."
    expected_atoms: [semantic-layer-evidence, plausible-but-wrong]
    must_contain:
      - приведены парные замеры с оговоркой, что это чужие схемы
      - чем грязнее схема, тем больше эффект
      - меняется характер ошибки — слой отвечает «не могу» вместо тихого вранья
      - свою величину надо мерить на своём голден-сете
    must_not:
      - конкретный процент обещан как гарантия для схемы пользователя
      - вендорская цифра подана без пометки об источнике
    status: needs_review

  - id: gs2-05
    question: "У нас окно модели 200К. Значит, можно грузить в контекст весь глоссарий и всю документацию?"
    expected_atoms: [context-layer-market, context-governance]
    must_contain:
      - качество падает по мере роста ввода задолго до заполнения окна
      - падение происходит рывком, а не постепенно
      - подавать надо только релевантное, фильтр прав применяется до поиска
    must_not:
      - больше контекста однозначно лучше
      - размер окна назван достаточным основанием
    status: needs_review

  - id: gs2-06
    question: "Мы полгода наполняли доменную базу знаний, объектов много, а точность бота не выросла. Что не так?"
    expected_atoms: [domain-knowledge-base, context-governance]
    must_contain:
      - наполнение, доверие и эффект — три разные метрики
      - в зачёт идут только подтверждённые объекты, сгенерированное учитывается после ревью
      - без этого правила автогенерация закрывает полноту, не добавляя знания
    must_not:
      - предложено просто добавить ещё объектов
      - полнота базы приравнена к её качеству
    status: needs_review

  - id: gs2-07
    question: "Назначили BI-партнёра верифицировать контекст домена. Он тонет в очереди. Нанимать второго?"
    expected_atoms: [context-governance]
    must_contain:
      - у гейта должен быть явный недельный бюджет времени
      - превышение бюджета чинит платформа, а не человек
      - нагрузка гейта — метрика здоровья платформы
      - куратор судит черновик машины, а не пишет контекст сам
    must_not:
      - первое предложение — увеличить штат верификаторов
      - предложено снять верификацию ради скорости
    status: needs_review

  - id: gs2-08
    question: "Хотим метрику AI-готовности домена. Возьмём долю сертифицированных дашбордов?"
    expected_atoms: [ai-ready-domain-score, content-certification]
    must_contain:
      - мерить надо долю потребления, а не долю покрытия
      - доля просмотров и запросов на сертифицированном, а не доля объектов
      - доля покрытия накручивается сертификацией мёртвого контента
      - в скор входят назначенные роли, а не только цифры
    must_not:
      - доля сертифицированных объектов принята как достаточная метрика
      - предложен конкретный универсальный порог
    blind: true
    status: needs_review

  - id: gs2-09
    question: "Купить готовую context-платформу или собирать самим? У вендора заявлено +38% к точности SQL."
    expected_atoms: [context-layer-market]
    must_contain:
      - покупать надо архитектуру, а не заявленные проценты
      - вопросы к вендору: где лежит контекст, чьи права, можно ли забрать данные
      - цифра +38% измерена самим вендором на своих данных
      - у открытых решений лицензия нулевая, но есть постоянная нагрузка на инженера
    must_not:
      - вендорская цифра процитирована как доказанная
      - выбор сведён к наличию MCP
    status: needs_review

  - id: gs2-10
    question: "Мы на какой стадии внедрения AI и можно ли пропустить организационную возню и сразу делать продукт?"
    expected_atoms: [ai-adoption-waves]
    must_contain:
      - названы наблюдаемые волны от энтузиазма к продуктизации
      - перепрыгнуть волну не получается, застрять можно
      - MCP — это водопровод, а не смысл
    must_not:
      - предложено пропустить упорядочивание и платформизацию
      - MCP назван решением задачи понимания домена
    status: needs_review

  # ---- Контент ----

  - id: gs2-11
    question: "Решили сертифицировать все отчёты в компании. Сколько это займёт?"
    expected_atoms: [content-certification, content-hygiene-loop]
    must_contain:
      - сертифицировать всё — это оверинжиниринг
      - автоматическая сертификация по машинным признакам на широкий круг
      - сертификация данных и методологии — только на самые просматриваемые или по требованию
      - песочницы и личные папки исключаются
    must_not:
      - сплошная сертификация поддержана
      - назван срок без вопроса об объёме и модели
    status: needs_review

  - id: gs2-12
    question: "У нас в проде куча отчётов, у которых нет владельца. Написали регламент — не помогло."
    expected_atoms: [content-hygiene-loop, bi-value-illusion]
    must_contain:
      - нужны три механизма сразу: автомониторинг, бот, социальный формат
      - начинать с автоархивации по признаку «нет пользователей, нет апдейтов»
      - цель субботника — создать привычку, а не сделать всё
      - вопрос передачи владения при уходе автора должен быть в процессе
    must_not:
      - предложен ещё один регламент как решение
      - обещано разовое наведение порядка
    status: needs_review

  - id: gs2-13
    question: "Сделали health-score по всем дашбордам. Пользователи всё равно спрашивают в чате, где отчёт."
    expected_atoms: [content-catalog-ux, content-certification]
    must_contain:
      - находимость — половина управления контентом
      - нужен каталог и роле-ориентированное рабочее место, а не только рейтинг
      - health-score без навигации остаётся невидимым бэкенд-рейтингом
    must_not:
      - предложено улучшить формулу скора
      - проблема сведена к обучению пользователей
    status: needs_review

  - id: gs2-14
    question: "Стайл-гайд написали, выложили в вики. Никто не использует. Что делать?"
    expected_atoms: [visual-style-guide]
    must_contain:
      - гайд работает только трёхслойным
      - шаблон и visual vocabulary живут в самом BI-инструменте
      - корпоративный учебник — вне инструмента
      - редизайн в шаблон как услуга плюс тренинги
    must_not:
      - предложено просто лучше его прорекламировать
      - все три слоя предложено держать в одном месте
    status: needs_review

  # ---- Self-service и governance ----

  - id: gs2-15
    question: "Хотим self-service: научим бизнес-пользователей самим собирать дашборды по шаблонам. Взлетит?"
    expected_atoms: [ssbi-vs-guided, ssbi-failure-causes]
    must_contain:
      - это не self-service, а guided BI — и термины стоит развести
      - принятие explorer-сценария у casual-пользователей близко к нулю
      - настоящий self-service — это инструменты для power users внутри бизнес-команд
      - сценарий с casual важен для adoption, но как guided
    must_not:
      - обучение casual-пользователей названо рабочим путём к self-service
      - обещан рост adoption от раздачи инструмента
    status: needs_review

  - id: gs2-16
    question: "Раздали права на разработку всем желающим, теперь в проде хаос. Отобрать доступы?"
    expected_atoms: [ssbi-workflow, content-certification]
    must_contain:
      - достроить обратный путь propose → prototype → promote
      - популярный self-service отчёт идёт в комитет как прототип массового
      - без обратного направления хороший отчёт остаётся локальным навсегда
    must_not:
      - изъятие доступов предложено как основное решение
      - предложено запретить self-service разработку
    status: needs_review

  - id: gs2-17
    question: "Можно ли отдать в self-service вообще всю отчётность и распустить централизованную команду?"
    expected_atoms: [ssbi-failure-causes, ssbi-vs-guided]
    must_contain:
      - названы сегменты, где self-service неэффективен по существу
      - общекорпоративная отчётность для топов остаётся централизованной
      - кросс-ролевая унифицированная отчётность и конфиденциальные данные тоже
      - без SSBI централизованный подход не достигнет единой версии правды, и наоборот
    must_not:
      - полный переход в self-service поддержан
      - централизованная команда названа устаревшей
    blind: true
    status: needs_review

  - id: gs2-18
    question: "Купили хороший BI-инструмент, дали аналитикам и бизнесу. Пользуются только аналитики. Почему?"
    expected_atoms: [ssbi-workflow, bi-adoption-barriers]
    must_contain:
      - потребителям данных дали инструменты аналитиков
      - маппинг ролей на инструменты различает consumers, explorers, analysts, scientists
      - барьеры принятия собираются постоянным контуром, а не разовым аудитом
    must_not:
      - проблема объяснена только недостатком обучения
      - предложено купить другой инструмент
    status: needs_review

  # ---- Данные и governance ----

  - id: gs2-19
    question: "Аналитики обходят регламент и лезут в сырые данные, потому что витрины делаются долго. Ужесточать контроль?"
    expected_atoms: [pain-fronts-2026, dg-launch-path]
    must_contain:
      - регламент, который дороже обхода, не соблюдается
      - инициативы governance и инициативы TTM идут парой, а не последовательно
    must_not:
      - ужесточение контроля предложено как основное решение
      - проблема названа дисциплинарной
    status: needs_review

  - id: gs2-20
    question: "Нам не дали бюджет на Data Governance. Значит, тему закрываем до следующего года?"
    expected_atoms: [dg-launch-path]
    must_contain:
      - отказ в бюджете — штатная ветка маршрута, а не тупик
      - продолжается Common Sense DG на уровне команд небольшими quick-win проектами
      - для перехода к программе нужно минимум два условия из четырёх
      - governance снизу переживает бюджетный цикл
    must_not:
      - направление объявлено закрытым без бюджета
      - предложено сначала добиться найма DG-офиса
    status: needs_review

  - id: gs2-21
    question: "Начинаем core-слой. Логично же начать с самых проблемных витрин, которые больше всего болят?"
    expected_atoms: [core-layer-project]
    must_contain:
      - начинать с самых больных — дорого и долго, проект заглохнет на первом тяжёлом случае
      - начинать с самых переиспользуемых кросс-доменных сущностей
      - сначала presentation, потом технический слой
      - health-score подсказывает кандидатов до ручного отбора
    must_not:
      - старт с самых проблемных витрин поддержан
      - предложено охватить все витрины сразу
    status: needs_review

  - id: gs2-22
    question: "Внедрили дата-каталог, он пустой — никто не заполняет описания. Как заставить?"
    expected_atoms: [data-catalog-pitfalls]
    must_contain:
      - максимально автоматизировать добычу метаданных
      - вносить документацию в потоке работы, вплоть до проверок в CI/CD
      - курировать топ-20% самых запрашиваемых объектов
    must_not:
      - основное решение — мотивировать людей заполнять карточки
      - предложено описать все объекты
    status: needs_review

  - id: gs2-23
    question: "Где AI точно поможет в управлении данными? Хотим заменить ручной труд команды."
    expected_atoms: [ai-in-data-processes, data-team-pain-points]
    must_contain:
      - чем ближе задача к «понять смысл», тем лучше результат; к «дать гарантию» — тем хуже
      - работает на классификации PII, дедупликации, сопоставлении схем, парсинге сложных документов
      - только под проверку — описания, перевод SQL, код пайплайнов
      - побеждает маршрутизация, а не замена процесса
    must_not:
      - обещана замена процесса целиком
      - вендорские цифры по генерации DQ-правил поданы как доказанные
    status: needs_review

  - id: gs2-24
    question: "Раздача доступов съедает время команды. Что можно автоматизировать?"
    expected_atoms: [access-automation, access-matrix]
    must_contain:
      - лицензии и идентификация роли автоматизируются
      - ролевая матрица не автоматизируется — её вытаскивают из владельцев и получают sign off
      - согласованная матрица даёт мандат на раздачу прав без дополнительных апрувов
      - отказ от поимённых прав на проде и наследование сверху
    must_not:
      - обещана полная автоматизация всей цепочки
      - матрица прав названа автоматизируемой
    status: needs_review

  # ---- Метрики и эффективность ----

  - id: gs2-25
    question: "Собрали дашборд из 40 метрик эффективности BI. Достаточно полно?"
    expected_atoms: [bi-project-metrics]
    must_contain:
      - правило отбора — пять основных и пять дополнительных
      - четыре группы: engagement, quality of service, process quality, business impact
      - ни одна метрика не измеряется самооценкой
    must_not:
      - большое число метрик названо преимуществом
      - предложено добавить ещё метрик
    status: needs_review

  - id: gs2-26
    question: "Вызовы нашего AI-агента выросли в три раза за квартал. Это успех?"
    expected_atoms: [ai-accelerator, ai-time-saving-trap]
    must_contain:
      - рост вызовов без роста успешных задач результатом не считается
      - мерить долю успешно завершённых AI-JTBD
      - рост вызовов может означать ретраи, а не адопшен
    must_not:
      - рост вызовов принят как доказательство эффекта
    blind: true
    status: needs_review

  - id: gs2-27
    question: "Не можем назвать процент бизнес-пользователей, заходящих в BI хотя бы раз в месяц. Не критично?"
    expected_atoms: [participants-2026-benchmark, content-promotion-monitoring]
    must_contain:
      - невозможность назвать процент — это находка диагностики
      - engagement rate целевой группы без match rate обманывает
      - нужен разрез по целевым группам, а не общий трафик
    must_not:
      - отсутствие метрики названо нормальным
      - предложено оценить экспертно и двигаться дальше
    status: needs_review

  # ---- Стратегия и внедрение ----

  - id: gs2-28
    question: "В стратегии по всем девяти категориям поставили целевую зрелость 3–4 из 4. Амбициозно и правильно?"
    expected_atoms: [action-plan]
    expected_files: [review-gates.md]
    must_contain:
      - уровни 3–4 по всем категориям — симптом непрочитанной диагностики
      - честный дефолт — плюс один уровень за год
      - больший сдвиг требует названной причины: мощность, финансирование, регуляторный срок
      - по каждой категории назвать потолок и отметку «достаточно»
    must_not:
      - максимальная целевая зрелость поддержана как амбиция
    status: needs_review

  - id: gs2-29
    question: "Составили список из 30 инициатив с датами. План готов?"
    expected_atoms: [action-plan]
    must_contain:
      - у каждой инициативы нужен названный владелец
      - нужны метрика и kill-gate
      - инициатива без владельца — строка в плане, а не изменение
      - нужен отрепетированный сценарий сокращения ресурса
    must_not:
      - список с датами признан достаточным
    status: needs_review

  - id: gs2-30
    question: "В стратегии писать только то, что делаем. Раздел про то, чего не делаем, — это же признак слабости?"
    expected_atoms: [innovation-map]
    expected_files: [review-gates.md]
    must_contain:
      - раздел «чего стратегия не делает» обязателен
      - сознательно исключённый стрим с гейтом сильнее стрима, включённого «потому что тренд»
      - это честный ответ на вопрос «а где наш AI»
    must_not:
      - раздел назван необязательным или вредным
    status: needs_review

  # ---- Люди ----

  - id: gs2-31
    question: "У нас грейд определяется широтой: знает и ETL, и SQL, и визуализацию — значит, синьор. Логично?"
    expected_atoms: [bi-competency-matrix]
    must_contain:
      - минимумы по базовым уровням у грейдов различаются мало
      - грейд определяется количеством компетенций высшего уровня
      - конструкция не даёт дорасти за счёт широты и требует глубины
      - LLM-компетентность встроена внутрь каждого уровня, а не отдельным навыком
    must_not:
      - широта названа достаточным основанием для грейда
    status: needs_review

  - id: gs2-32
    question: "Агенты забирают рутину, джуны стали не нужны. Сокращаем джун-позиции?"
    expected_atoms: [bi-hiring-ai-era]
    must_contain:
      - сжатие команд создаёт кадровый риск, которым надо управлять
      - исчезает вход в профессию, через несколько лет некому растить синьоров
      - переводить джунов в кураторы домена, растить через ревью AI-аутпутов
      - намеренно оставлять часть рутины для заземления
    must_not:
      - сокращение джунов поддержано как рациональное
      - риск выхолащивания оператора агента проигнорирован
    blind: true
    status: needs_review
