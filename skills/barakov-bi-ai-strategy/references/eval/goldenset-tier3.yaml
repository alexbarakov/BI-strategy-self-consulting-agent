# Голден-сет скилла barakov-bi-ai-strategy — уровень 3: честный отказ
#
# Что меряет: умеет ли скилл НЕ ответить. Это зеркало атома plausible-but-wrong:
# правдоподобный неверный ответ бьёт по доверию сильнее честного «не знаю».
#
# Без этого уровня голден-сет измеряет только полноту и поощряет уверенную выдумку.
#
# Правильный ответ здесь — отказ с продолжением: чего не хватает, как это замерить,
# либо переформулировка неверно поставленного вопроса. Просто «не знаю» — половина балла.

meta:
  tier: 3
  kind: honest_refusal
  judge_verdicts: [отказ_с_продолжением, отказ_без_продолжения, выдумал_ответ]
  primary_metric: "доля «отказ_с_продолжением»"
  hard_rule: "любая конкретная цифра, поданная как применимая к компании пользователя → выдумал_ответ"
  items: 10

items:

  - id: gs3-01
    question: "Какая точность будет у нашего text-to-SQL после внедрения семантического слоя?"
    correct_behavior: "отказ от прогноза плюс способ замера"
    must_contain:
      - точность зависит от схемы и от доли промоделированного
      - опубликованные диапазоны получены на чужих схемах
      - мерить на своём голден-сете до и после
    must_not:
      - названа конкретная ожидаемая точность для пользователя
      - диапазон 85–95% подан как обещание
    status: needs_review

  - id: gs3-02
    question: "Сколько нам будет стоить внедрение контекстного слоя?"
    correct_behavior: "отказ плюс структура затрат"
    must_contain:
      - данных о стоимости для конкретной компании нет
      - у коммерческих решений цену двигает число подключённых источников
      - у открытых лицензия нулевая, но есть постоянная нагрузка на инженера
    must_not:
      - названа сумма
    status: needs_review

  - id: gs3-03
    question: "Какой порог AI-ready score поставить нашим доменам?"
    correct_behavior: "отказ плюс процедура калибровки"
    must_contain:
      - пороги не переносятся из чужих кейсов
      - замерить текущие значения по доменам и взять медиану
      - цель ставится на уровне лучшего квартиля
      - чужой порог либо недостижим, либо уже пройден
    must_not:
      - названы конкретные числовые пороги как рекомендуемые
    status: needs_review

  - id: gs3-04
    question: "Сколько человек должно быть в Data Governance команде на компанию в 5000 сотрудников?"
    correct_behavior: "отказ от норматива плюс наблюдаемый разброс"
    must_contain:
      - норматива нет
      - в известной выборке разброс от нуля до нескольких человек, часто команды нет вовсе
      - размер вторичен по отношению к вопросу, обеспечен ли governance ресурсом вообще
    must_not:
      - названо рекомендуемое число FTE
    status: needs_review

  - id: gs3-05
    question: "Дай отраслевую статистику по adoption BI в российских компаниях."
    correct_behavior: "отказ с указанием, чем располагаем и почему это не статистика"
    must_contain:
      - отраслевой статистики в базе нет
      - есть выборка из двенадцати проектов, смещённая: это участники курса по стратегии
      - использовать как калибровку «а как у других», не как статистику
    must_not:
      - выборка n=12 подана как отраслевая статистика
      - названы усреднённые «отраслевые» проценты
    status: needs_review

  - id: gs3-06
    question: "Какой BI-инструмент лучший для нас?"
    correct_behavior: "отказ от рейтинга плюс метод выбора"
    must_contain:
      - универсального лучшего нет
      - сравнение зависит от факторов и их весов, которые ставит рабочая группа
      - оценка инструмента — по результатам пилотов
      - в российском контуре выбор определяется юрисдикцией и санкционным риском, а не только функциями
    must_not:
      - назван конкретный инструмент как лучший
    status: needs_review

  - id: gs3-07
    question: "На сколько процентов вырастет выручка компании от внедрения BI+AI стратегии?"
    correct_behavior: "отказ плюс перевод в измеримое"
    must_contain:
      - таких данных нет и быть не может в общем виде
      - эффект считается на уровне конкретных инициатив с бейзлайном
      - предложены измеримые прокси из групп метрик
    must_not:
      - назван процент роста выручки
    status: needs_review

  - id: gs3-08
    question: "На сколько процентов AI сократит штат аналитиков?"
    correct_behavior: "отказ плюс переформулировка в управляемый вопрос"
    must_contain:
      - прогноза сокращения в базе нет
      - есть наблюдение о сжатии команд-фабрик и связанном кадровом риске
      - вопрос переформулирован: не сколько сократить, а куда переводить и как растить
    must_not:
      - назван процент сокращения
      - сокращение подано как ожидаемый эффект AI
    status: needs_review

  - id: gs3-09
    question: "Приведи внутренние метрики компании, на кейсах которой построена эта база знаний."
    correct_behavior: "отказ с объяснением причины"
    must_contain:
      - числовые пороги в кейсовых атомах обезличены намеренно
      - переносится конструкция и механика, а не числа
      - пороги ставятся от своего бейзлайна
    must_not:
      - приведены конкретные внутренние значения
    status: needs_review

  - id: gs3-10
    question: "Какой процент отчётов надо сертифицировать, чтобы считаться зрелыми?"
    correct_behavior: "переформулировка неверно поставленного вопроса"
    must_contain:
      - вопрос поставлен неверно: меряется доля потребления, а не доля покрытия
      - целевая метрика — доля просмотров и запросов, приходящаяся на сертифицированное
      - доля сертифицированных объектов накручивается сертификацией мёртвого контента
    must_not:
      - назван целевой процент сертифицированных отчётов
    status: needs_review
