# Machine-readable knowledge map for the BI+AI Strategy Builder.
# Purpose: given a block number, the agent finds what to read locally and what to take
# from the DG Board KB companion. The analogue of the companion's 30_graph/objects.yaml.

meta:
  skill: bi-strategy
  kb: "references/kb/  # 66 atoms; graph in references/kb/30-graph.yaml"
  document: "6 sections: context, vision, streams, initiatives, goals as metrics, risks (strategy-requirements.md)"
  frame: "7 blocks of the analysis frame (D&A Strategy & Tactics Planner) + Health Check diagnosis"
  phases: "AS-IS = blocks 1-2 · TO-BE = blocks 3-6 · Transformation = block 7"

companion:
  id: DG-strategy-self-consulting-agent
  url: "https://github.com/alexbarakov/DG-strategy-self-consulting-agent"
  entry: "README.md"
  graph: "30_graph/objects.yaml"
  role: "grounds governance, DG practice and the AI foundation; the visual source is the public Miro board"
  precedence:
    bi_ai_questions: "this skill leads, the companion supplies the governance layer"
    dg_questions: "the companion leads, this skill supplies the BI/AI stream"
    conflict: "on governance the companion wins, on BI/AI this skill does; the invariants are shared"
  shared_invariants:
    - "the stack-rank and the freeze order"
    - "kill-gates before launching AI initiatives"
    - "AI drafts - humans validate"
    - "the chain core -> semantic -> context -> AI accuracy -> self-service"

# Freeze order: we cut right to left
stack_rank:
  - governance-and-ownership
  - trusted-data
  - ai-readiness-triad      # certified core -> semantic layer -> domain knowledge base
  - bi-content
  - self-service-and-agentic

kill_gates:
  - id: no-assistant-without-foundation
    rule: "no assistant without semantic coverage of the target domains and a certified core"
  - id: no-selfservice-without-governance
    rule: "no self-service scaling without a governance gate and quality monitoring"
  - id: no-semantic-without-core
    rule: "no semantic layer without a core layer beneath it"
  - id: no-agent-write-without-identity
    rule: "no agent write operations without its own identity, narrow keys and an audit trail"

blocks:
  - id: 1
    title: "Business foundation"
    phase: as-is
    local: [strategy-template.md, question-bank.md]
    companion:
      - "11_dg_program_themes/getting-started.md   # the 5-of-12 test: is a programme needed at all"
      - "11_dg_program_themes/dg-kitchen-research.md"
    evidence: []
    kb: "30-graph.yaml → blocks[1]"

  - id: 2
    title: "D&A landscape assessment"
    phase: as-is
    local: [diagnostic.md, question-bank.md, make-maturity-svg.py, evidence-2026.md]
    companion:
      - "11_dg_program_themes/maturity-and-metrics.md"
      - "11_dg_program_themes/dg-frameworks.md"
    evidence: ["the map of where AI works in data processes - evidence-2026.md, section 2"]
    kb: "30-graph.yaml → blocks[2]"

  - id: 3
    title: "Target operating model"
