# Companion tools and sources useful in any block
cross_cutting:
  eval: "references/70-golden-set/   # a three-tier golden set; the rule: the set is frozen before changes and never reworded to fit retrieval"
  requirements: "references/strategy-requirements.md   # acceptance spec: 6 document sections, DoD, disqualifiers; gate 0 in FORM, scorecard in AUDIT"
  faq: "references/faq-participants.md   # 101 participant questions with provenance-tagged answers"
  kb_entry: "references/kb/30-graph.yaml   # block -> atoms; key_evidence holds the numbers for defending priorities"
  kb_always_read: [guide-structure, innovation-map, plausible-but-wrong, ai-time-saving-trap, participants-2026-benchmark]
  kb_anonymized: "atoms listed under anonymized_cases in 30-graph.yaml are worked cases with anonymized thresholds - carry the mechanics, not the numbers"
  workshop_templates: "12_templates/templates.md   # pain analysis, domain classifier, vision statement, canvases"
  reading_library: "10_ai_era_themes/library.md"
  source_verification: "40_sources.md"
