# The machine-readable graph of the knowledge base.
# Given a strategy block number, the agent finds the relevant atoms.
# The counterpart of 30_graph/objects.yaml in the companion repository DG-strategy-self-consulting-agent:
# the folder numbering is shared - one number means one role in both repositories.

meta:
  skill: bi-strategy
  triage: "50-failure-catalog.md   # the entry point for \"something is wrong here\": symptom -> family -> atom"
  numbers: "51-numbers.md          # every figure carries a reliability tag; the tag travels with the number"
  root: references/kb
  atoms: 66
  convention: "one file = one topic; links through wiki-links"

sources:
  - id: guide-2.0
    title: "BI Strategy & Tactics Guide 2.0"
    kind: spreadsheet
    author: DataNature
    url: "https://docs.google.com/spreadsheets/d/1thAW0TipIHBjxrnNWyVO0ztzkluFm-g8hgE6UqJloTo"
    covers: 11-method/*
  - id: miro-board
    title: "BI Strategy Guide 2.0 + BI Project Innovation Map"
    kind: miro
    url: "https://miro.com/app/board/o9J_lha8MnM=/"
    covers: 20-catalog/innovation-map.md
    note: "the Guide 2.0 frame is a visual mirror of the workbook; the Innovation Map is a unique catalog of directions"
  - id: course-2026
    title: "The course \"Building a BI+AI strategy 2026\", 9 days"
    kind: slides
    covers: 10-ai-era/*
  - id: precourse-survey
    title: "The pre-course participant survey, n=12, July-August 2026"
    kind: survey
    covers: 31-field/*
    note: "most respondents allowed disclosure only in aggregate"

# The method's working order: the guide's sections, left to right
method_spine:
  - {section: 1, phase: as-is,          atoms: [painpoints-analysis, data-domains-classification, user-classification, info-supply-demand, bi-adoption-stats]}
  - {section: 2, phase: to-be,          atoms: [data-mgmt-processes, critical-data-status, content-mgmt-processes, selfservice-practices, centralized-practices, bi-toolset-landscape]}
  - {section: 3, phase: operations,     atoms: [access-matrix, regular-meetings, rules-and-standards, onboarding-plan, bi-project-metrics]}
  - {section: 4, phase: transformation, atoms: [action-plan]}
  - {section: 5, phase: vision,         atoms: [vision-statement]}

blocks:
  - id: 1
    title: "The business foundation"
    method: [painpoints-analysis, data-domains-classification, user-classification, info-supply-demand, bi-adoption-stats, vision-statement]
    course: [bi-value-illusion, bi-strategy-purpose, data-team-pain-points]
    field: [pain-fronts-2026, participants-2026-benchmark]

  - id: 2
    title: "Assessment of the D&A landscape"
    method: [info-supply-demand, bi-adoption-stats]
    course: [maturity-models, bi-adoption-barriers, data-utility-gap, ai-ready-domain-score, ai-in-data-processes, plausible-but-wrong]
    field: [participants-2026-benchmark, pain-fronts-2026]

  - id: 3
    title: "The target operating model"
    method: [user-classification]
    course: [ssbi-vs-guided, ssbi-failure-causes, ssbi-workflow, bi-org-structure, unified-bi-platform, nextgen-report-formats]

  - id: 4.1
    title: "Data Models Management"
    method: [data-mgmt-processes, critical-data-status, data-domains-classification, access-matrix]
    course: [core-layer-project, dg-launch-path, data-catalog-pitfalls, glossary-vs-dictionary, access-automation, ai-in-data-processes, data-team-pain-points]

  - id: 4.2
    title: "BI Report Management"
    method: [content-mgmt-processes, centralized-practices]
    course: [content-catalog-ux, content-certification, content-hygiene-loop, visual-style-guide, content-promotion-monitoring, nextgen-report-formats]

  - id: 4.3
    title: "Insight Management"
    method: [selfservice-practices, centralized-practices]
    course: [insight-management, ai-cases-in-prod, bi-community-management, domain-knowledge-base, centralized-bi-brand]

  - id: 5
    title: "The technology foundation"
    method: [bi-toolset-landscape, critical-data-status]
    course: [ai-triad-prerequisites, llm-assistant-architecture, domain-knowledge-base, context-governance, context-layer-market, semantic-layer-evidence, core-layer-project, bi-tool-selection, unified-bi-platform, ai-in-bi-approaches, ai-adoption-waves]

  - id: 6
    title: "The operating foundation"
    method: [regular-meetings, rules-and-standards, onboarding-plan, bi-project-metrics, access-matrix]
    course: [bi-org-structure, bi-routine-calendar, bi-competency-matrix, bi-hiring-ai-era, bi-community-management, centralized-bi-brand, infra-billing, ai-accelerator]

  - id: 7
    title: "Change management"
    method: [action-plan, vision-statement]
    course: [dg-launch-path, ai-adoption-waves, ai-accelerator, ai-time-saving-trap, bi-hiring-ai-era, infra-billing]
    catalog: [innovation-map]

# Atoms worth reading always, whatever the block
cross_cutting:
  - guide-structure          # the method's spine: without it the order makes no sense
  - innovation-map           # the map of all directions: a completeness checklist
  - plausible-but-wrong      # the central risk from which all the gates are derived
  - ai-time-saving-trap      # the ban on measuring effect in saved hours
  - participants-2026-benchmark  # calibration against everyone else

# The figures most often needed to defend priorities
key_evidence:
  - {claim: "88% of reports die within 3 months, 2% deliver a stable result", atom: bi-value-illusion, confidence: verifiable}
  - {claim: "median dashboard lifetime ~50 days, 136 with mature practices", atom: bi-value-illusion, confidence: verifiable}
  - {claim: "text-to-SQL on real enterprise schemas ~40%; 85-95% with a semantic layer", atom: semantic-layer-evidence, confidence: mixed}
  - {claim: "paired measurements: 16.7% -> 54.2% on a corporate schema of 199 tables", atom: semantic-layer-evidence, confidence: verifiable}
  - {claim: "the model barely matters - reasoning effort does not change accuracy once the layer exists", atom: semantic-layer-evidence, confidence: verifiable}
  - {claim: "domain bot accuracy ~25% without a knowledge base, ~80% with a populated one", atom: domain-knowledge-base, confidence: "verifiable, internal measurement"}
  - {claim: "context rot: noticeable accuracy loss already at 50K tokens with a 200K window", atom: context-layer-market, confidence: verifiable}
  - {claim: "model-written descriptions are wrong three times more often than human ones: 19.6% vs 6.3% (disputed - do not quote)", atom: ai-in-data-processes, confidence: verifiable}
  - {claim: "developers 19% slower while convinced they were 20% faster", atom: ai-in-data-processes, confidence: verifiable}
  - {claim: "20-40% of domains cover 60-85% of use cases", atom: info-supply-demand, confidence: verifiable}
  - {claim: "in 4 of the 12 sampled companies there is no governance team at all", atom: participants-2026-benchmark, confidence: "self-report, n=12"}
  - {claim: "not one company in the sample has a fully mature semantic layer", atom: participants-2026-benchmark, confidence: "self-report, n=12"}

# Cases from practice: the numeric thresholds are anonymized (order of effect instead of an exact figure).
# The rule: transplant the construction and the mechanics, set the thresholds from your own baseline.
anonymized_cases:
  - ai-ready-domain-score
  - ai-cases-in-prod
  - core-layer-project
  - infra-billing
  - domain-knowledge-base
  - context-governance
  - ai-accelerator
  - bi-competency-matrix
  - bi-hiring-ai-era
  - unified-bi-platform

# ---------------------------------------------------------------------------
# THE THEME GRAPH. Nodes are the base's atoms; cluster and connectivity are computed from the files.
# The visual version: 30-graph.md (Mermaid, rendered natively on GitHub).
#
# relations is the curated semantic core: typed links that carry
# the working order and the preconditions. The full undirected set of links lives
# in the atoms themselves as wiki-links - 283 edges over 66 nodes, with no isolates.
# ---------------------------------------------------------------------------

graph_meta:
  nodes: 66
  wiki_edges: 283
  curated_relations: 44
  mutual_pairs: 0
  isolated: 0
  relation_types: [prerequisite, enables, governs, feeds, measures, motivates, implements, operates, sequences, calibrates, explains, constrains, addresses, aligns, staffs, funds, precedes, closes, contains, demonstrates, maps-onto, completes]

