# The bi-strategy skill's golden set - tier 2: answer quality
#
# What it measures: did the agent say what it had to, and did it NOT say what it must not.
# Scored by an LLM judge against a rubric. Maintained by hand.
#
# The questions are deliberately rephrased IN THE PARTICIPANT'S LANGUAGE rather than the
# knowledge base's: the set has to test understanding, not string overlap with the FAQ.
#
# must_not is the central field. These are specific wrong answers that the knowledge base
# explicitly refutes. An answer containing any must_not item gets the verdict "wrong"
# regardless of how many must_contain items it covered.
#
# blind: true - the item is not shown during skill development and is used only at measurement time.

meta:
  tier: 2
  kind: answer_quality
  judge_verdicts: [correct_with_a_decision, correct_without_a_decision, wrong_or_invented]
  primary_metric: "the share of correct_with_a_decision"
  secondary_metric: "the share of correct_with_a_decision plus correct_without_a_decision"
  hard_rule: "any match against must_not -> wrong_or_invented"
  items: 32

items:

  # ---- The AI foundation: the most expensive mistakes ----

  - id: gs2-01
    question: "We have decided to build an AI assistant. In parallel we are starting the semantic layer, the core layer and a domain knowledge base, to go faster. Is that a sound plan?"
    expected_atoms: [ai-triad-prerequisites, core-layer-project]
    must_contain:
      - build one layer at a time rather than in parallel
      - start with the layer that closes the domain's most expensive pain
      - an eval before and after, so the real gain is visible
    must_not:
      - launching all three layers in parallel is called fine
      - the build order is declared unimportant
      - a recommendation to start with the assistant
    status: needs_review

  - id: gs2-02
    question: "We worked it out: AI saved the analysts 200 hours last quarter. Can I take that to management as the effect?"
    expected_atoms: [ai-time-saving-trap, bi-project-metrics]
    must_contain:
      - a person's time saved does not equal a gain for the company
      - the freed time dissolves without an explicit reallocation decision
      - you have to name who makes the decision and where the resource goes
    must_not:
      - yes, that is a finished effect
      - multiplying the hours by an hourly rate is enough
      - the team's self-assessment is accepted as proof
    blind: true
    status: needs_review

  - id: gs2-03
    question: "Our text-to-SQL pilot worked beautifully on the demo schema. What could go wrong on our real schema?"
    expected_atoms: [plausible-but-wrong, semantic-layer-evidence]
    must_contain:
      - a toy schema has a small space and obvious joins
      - in production the agent returns a syntactically valid but wrong answer
      - a plausible wrong answer damages trust more than an honest refusal
    must_not:
      - the demo's success is transferred to production without caveats
      - the problem is reduced to prompt quality
      - a specific accuracy is promised on the user's schema
    status: needs_review

  - id: gs2-04
    question: "How much will a semantic layer raise accuracy for us? I want a number to defend the budget."
    expected_atoms: [semantic-layer-evidence, plausible-but-wrong]
    must_contain:
      - the paired measurements are given with the caveat that these are other people's schemas
      - the dirtier the schema, the bigger the effect
      - the nature of the error changes - the layer answers "I can't" instead of lying silently
      - your own figure has to be measured on your own golden set
    must_not:
      - a specific percentage is promised as a guarantee for the user's schema
      - a vendor figure is presented without flagging its source
    status: needs_review

  - id: gs2-05
    question: "Our model has a 200K window. So we can load the whole glossary and all the documentation into the context?"
    expected_atoms: [context-layer-market, context-governance]
    must_contain:
      - quality degrades as input grows, long before the window fills
      - the decline is continuous rather than a cliff, and the threshold in the cliff paper is a share of the window rather than an absolute token count
      - serve only what is relevant, with the entitlement filter applied before the search
    must_not:
      - more context is unambiguously better
      - the window size is named as sufficient grounds
    status: needs_review

  - id: gs2-06
    question: "We spent six months populating the domain knowledge base, there are plenty of objects, and the bot's accuracy has not risen. What is wrong?"
    expected_atoms: [domain-knowledge-base, context-governance]
    must_contain:
      - population, trust and effect are three different metrics
      - only confirmed objects count, and generated ones count after review
      - without that rule, auto-generation closes completeness while adding no knowledge
    must_not:
      - the suggestion is simply to add more objects
      - the base's completeness is equated with its quality
    status: needs_review

  - id: gs2-07
    question: "We put the BI partner in charge of verifying the domain's context. They are drowning in the queue. Do we hire a second one?"
    expected_atoms: [context-governance]
    must_contain:
      - the gate has to have an explicit weekly time budget
      - going over the budget is fixed by the platform, not by the person
      - the gate's load is a platform health metric
      - the curator judges the machine's draft rather than writing context themselves
    must_not:
      - the first suggestion is to grow the headcount of verifiers
      - dropping verification for the sake of speed is suggested
    status: needs_review

  - id: gs2-08
    question: "We want a metric for the domain's AI readiness. Shall we take the share of certified dashboards?"
    expected_atoms: [ai-ready-domain-score, content-certification]
    must_contain:
      - measure the share of consumption, not the share of coverage
      - the share of views and queries on certified content, not the share of objects
      - the coverage share can be inflated by certifying dead content
      - the score includes the named roles, not only the numbers
    must_not:
      - the share of certified objects is accepted as a sufficient metric
      - a specific universal threshold is proposed
    blind: true
    status: needs_review

  - id: gs2-09
    question: "Buy a ready context platform or build our own? The vendor claims 38% better SQL accuracy."
    expected_atoms: [context-layer-market]
    must_contain:
      - buy the architecture, not the claimed percentages
      - the questions to ask the vendor: where the context sits, whose entitlements apply, whether you can take the data out
      - the 38% figure was measured by the vendor on its own data
      - open-source solutions have a zero licence but a standing load on an engineer
    must_not:
      - the vendor figure is quoted as proven
      - the choice is reduced to whether MCP is supported
    status: needs_review

  - id: gs2-10
    question: "Which stage of AI adoption are we at, and can we skip the organizational fuss and go straight to a product?"
    expected_atoms: [ai-adoption-waves]
    must_contain:
      - the observable waves from enthusiasm to productization are named
      - you cannot skip a wave, but you can get stuck in one
      - MCP is the plumbing, not the meaning
    must_not:
      - skipping the ordering and platformization stages is suggested
      - MCP is called the solution to understanding the domain
    status: needs_review

  # ---- Content ----

  - id: gs2-11
    question: "We have decided to certify every report in the company. How long will that take?"
    expected_atoms: [content-certification, content-hygiene-loop]
    must_contain:
      - certifying everything is over-engineering
      - automatic certification on machine-checkable signs, applied broadly
      - data and methodology certification only for the most-viewed reports or on request
      - sandboxes and personal folders are excluded
    must_not:
      - blanket certification is endorsed
      - a timeline is given without asking about the volume and the model
    status: needs_review

  - id: gs2-12
    question: "We have a pile of reports in production with no owner. We wrote a policy and it did not help."
    expected_atoms: [content-hygiene-loop, bi-value-illusion]
    must_contain:
      - three mechanisms are needed at once: automated monitoring, the bot, the social format
      - start with automatic archiving on the "no users, no updates" signal
      - the clean-up day's goal is to build a habit, not to do everything
      - handing over ownership when an author leaves has to be part of the process
    must_not:
      - another policy is proposed as the solution
      - a one-off tidy-up is promised
    status: needs_review

  - id: gs2-13
    question: "We built a health score across all the dashboards. Users still ask in the chat where a report is."
    expected_atoms: [content-catalog-ux, content-certification]
    must_contain:
      - findability is half of content management
      - you need a catalog and a role-oriented workplace, not only a rating
      - a health score without navigation stays an invisible back-end rating
    must_not:
      - improving the score formula is proposed
      - the problem is reduced to training the users
    status: needs_review

  - id: gs2-14
    question: "We wrote a style guide and put it on the wiki. Nobody uses it. What do we do?"
    expected_atoms: [visual-style-guide]
    must_contain:
      - a guide works only in three layers
      - the template and the visual vocabulary live inside the BI tool itself
      - the corporate textbook lives outside the tool
      - redesign into the template as a service, plus training
    must_not:
      - simply promoting it better is proposed
      - keeping all three layers in one place is proposed
    status: needs_review

  # ---- Self-service and governance ----

  - id: gs2-15
    question: "We want self-service: we will teach business users to assemble dashboards themselves from templates. Will it fly?"
    expected_atoms: [ssbi-vs-guided, ssbi-failure-causes]
    must_contain:
      - this is not self-service but guided BI, and the terms are worth separating
      - uptake of the explorer scenario among casual users is close to zero
      - real self-service means tools for power users inside the business teams
      - the casual scenario matters for adoption, but as guided BI
    must_not:
      - training casual users is called a working route to self-service
      - adoption growth is promised from handing out the tool
    status: needs_review

  - id: gs2-16
    question: "We gave development rights to everyone who asked, and now production is chaos. Do we take the access away?"
    expected_atoms: [ssbi-workflow, content-certification]
    must_contain:
      - build the reverse path propose -> prototype -> promote
      - a popular self-service report goes to the committee as the prototype of a mass report
      - without the reverse direction a good report stays local forever
    must_not:
      - revoking access is proposed as the main solution
      - banning self-service development is proposed
    status: needs_review

  - id: gs2-17
    question: "Could we hand all reporting over to self-service and disband the centralized team?"
    expected_atoms: [ssbi-failure-causes, ssbi-vs-guided]
    must_contain:
      - the segments where self-service is ineffective by its nature are named
      - company-wide reporting for executives stays centralized
      - so do cross-role unified reporting and confidential data
      - without self-service the centralized approach will not reach a single version of the truth, and vice versa
    must_not:
      - a full move to self-service is endorsed
      - the centralized team is called obsolete
    blind: true
    status: needs_review

  - id: gs2-18
    question: "We bought a good BI tool and gave it to analysts and to the business. Only the analysts use it. Why?"
    expected_atoms: [ssbi-workflow, bi-adoption-barriers]
    must_contain:
      - data consumers were given the analysts' tools
      - the role-to-tool mapping distinguishes consumers, explorers, analysts and scientists
      - adoption barriers are gathered through a standing circuit, not a one-off audit
    must_not:
      - the problem is explained solely by a lack of training
      - buying a different tool is proposed
    status: needs_review

  # ---- Data and governance ----

  - id: gs2-19
    question: "Analysts go around the rules and reach into raw data because marts take too long. Do we tighten control?"
    expected_atoms: [pain-fronts-2026, dg-launch-path]
    must_contain:
      - a rule that costs more than going around it will not be followed
      - governance initiatives and time-to-market initiatives move as a pair, not in sequence
    must_not:
      - tightening control is proposed as the main solution
      - the problem is called a disciplinary one
    status: needs_review

  - id: gs2-20
    question: "We were refused the data governance budget. Does that mean we shelve the topic until next year?"
    expected_atoms: [dg-launch-path]
    must_contain:
      - a budget refusal is a standard branch of the route, not a dead end
      - common-sense governance continues at team level through small quick-win projects
      - moving to a programme requires at least two of four conditions
      - governance started from the bottom survives the budget cycle
    must_not:
      - the direction is declared closed without a budget
      - getting a governance office hired first is proposed
    status: needs_review

  - id: gs2-21
    question: "We are starting the core layer. Surely it makes sense to begin with the most problematic marts, the ones that hurt most?"
    expected_atoms: [core-layer-project]
    must_contain:
      - starting with the most painful is expensive and slow, and the project stalls on the first hard case
      - start with the most reused cross-domain entities
      - presentation layer first, technical layer second
      - the health score suggests candidates before any manual selection
    must_not:
      - starting with the most problematic marts is endorsed
      - covering all the marts at once is proposed
    status: needs_review

  - id: gs2-22
    question: "We rolled out a data catalog and it is empty - nobody fills in the descriptions. How do we make them?"
    expected_atoms: [data-catalog-pitfalls]
    must_contain:
      - automate metadata extraction as far as possible
      - enter documentation in the flow of work, up to and including CI/CD checks
      - curate the top 20% of most-queried objects
    must_not:
      - the main solution is motivating people to fill in the cards
      - describing every object is proposed
    status: needs_review

  - id: gs2-23
    question: "Where will AI definitely help in data management? We want to replace the team's manual work."
    expected_atoms: [ai-in-data-processes, data-team-pain-points]
    must_contain:
      - the closer the task is to "make sense of meaning" the better the result; the closer to "give a guarantee" the worse
      - it works on PII classification, deduplication, schema matching and parsing complex documents
      - only under verification - descriptions, SQL translation, pipeline code
      - routing wins, not replacing the process
    must_not:
      - replacing the process outright is promised
      - vendor figures on generating data quality rules are presented as proven
    status: needs_review

  - id: gs2-24
    question: "Handing out access eats the team's time. What can be automated?"
    expected_atoms: [access-automation, access-matrix]
    must_contain:
      - licences and role identification can be automated
      - the role matrix cannot - it has to be pulled out of the owners and signed off
      - an agreed matrix is the mandate to hand out access without further approvals
      - no per-person entitlements in production, and inheritance from above
    must_not:
      - full automation of the whole chain is promised
      - the entitlement matrix is called automatable
    status: needs_review

  # ---- Metrics and efficiency ----

  - id: gs2-25
    question: "We assembled a dashboard of 40 BI performance metrics. Is that comprehensive enough?"
    expected_atoms: [bi-project-metrics]
    must_contain:
      - the selection rule is five primary and five secondary
      - four groups: engagement, quality of service, process quality, business impact
      - not one metric is measured by self-assessment
    must_not:
      - a large number of metrics is called an advantage
      - adding more metrics is proposed
    status: needs_review

  - id: gs2-26
    question: "Calls to our AI agent tripled last quarter. Is that a success?"
    expected_atoms: [ai-accelerator, ai-time-saving-trap]
    must_contain:
      - a rise in calls with no rise in successful tasks does not count as a result
      - measure the share of successfully completed AI jobs-to-be-done
      - a rise in calls may mean retries rather than adoption
    must_not:
      - the rise in calls is accepted as proof of effect
    blind: true
    status: needs_review

  - id: gs2-27
    question: "We cannot name the percentage of business users who open BI at least monthly. Not critical?"
    expected_atoms: [participants-2026-benchmark, content-promotion-monitoring]
    must_contain:
      - not being able to name a percentage is itself a diagnostic finding
      - the target group's engagement rate without the match rate deceives
      - you need the cut by target group, not overall traffic
    must_not:
      - the missing metric is called normal
      - estimating it by expert judgement and moving on is proposed
    status: needs_review

  # ---- Strategy and rollout ----

  - id: gs2-28
    question: "In our strategy we set target maturity at 3-4 out of 4 across all nine categories. Ambitious and right?"
    expected_atoms: [action-plan]
    expected_files: [review-gates.md]
    must_contain:
      - levels 3-4 in every category is a symptom of an unread diagnostic
      - the honest default is plus one level a year
      - a bigger shift requires a named reason: capacity, funding, a regulatory deadline
      - for each category, name the ceiling and where "enough" sits
    must_not:
      - maximum target maturity is endorsed as ambition
    status: needs_review

  - id: gs2-29
    question: "We put together a list of 30 initiatives with dates. Is the plan done?"
    expected_atoms: [action-plan]
    must_contain:
      - every initiative needs a named owner
      - a metric and a kill-gate are needed
      - an initiative with no owner is a line in a plan, not a change
      - a rehearsed resource-cut scenario is needed
    must_not:
      - a list with dates is judged sufficient
    status: needs_review

  - id: gs2-30
    question: "A strategy should only say what we are doing. Surely a section on what we are not doing signals weakness?"
    expected_atoms: [innovation-map]
    expected_files: [review-gates.md]
    must_contain:
      - the "what the strategy does not do" section is mandatory
      - a deliberately excluded stream with a gate is stronger than a stream included "because it is a trend"
      - it is the honest answer to "so where is our AI"
    must_not:
      - the section is called optional or harmful
    status: needs_review

  # ---- People ----

  - id: gs2-31
    question: "For us the grade comes from breadth: they know ETL, SQL and visualization, so they are a senior. Sound?"
    expected_atoms: [bi-competency-matrix]
    must_contain:
      - the minimums at the base levels barely differ between grades
      - the grade is determined by the number of top-level competencies
      - the construction stops people growing on breadth and requires depth
      - LLM competence is built into every level rather than being a separate skill
    must_not:
      - breadth is called sufficient grounds for a grade
    status: needs_review

  - id: gs2-32
    question: "Agents are taking the routine and juniors are no longer needed. Do we cut the junior roles?"
    expected_atoms: [bi-hiring-ai-era]
    must_contain:
      - compressing teams creates a staffing risk that has to be managed
      - the entry route into the profession disappears, and in a few years there is nobody to grow into senior
      - move juniors into domain curator roles and grow them through reviewing AI outputs
      - deliberately keep some routine as ballast
    must_not:
      - cutting juniors is endorsed as rational
      - the risk of hollowing out an agent operator is ignored
    blind: true
    status: needs_review
