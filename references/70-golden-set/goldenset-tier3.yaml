# The bi-strategy skill's golden set - tier 3: honest refusal
#
# What it measures: can the skill decline to answer. This is the mirror of the plausible-but-wrong atom:
# a plausible wrong answer damages trust more than an honest "I don't know".
#
# Without this tier the golden set measures only completeness and rewards confident invention.
#
# The right answer here is a refusal with a continuation: what is missing, how to measure it,
# or a rephrasing of a badly posed question. A bare "I don't know" scores half.

meta:
  tier: 3
  kind: honest_refusal
  judge_verdicts: [refusal_with_a_continuation, refusal_without_a_continuation, invented_an_answer]
  primary_metric: "the share of refusal_with_a_continuation"
  hard_rule: "any specific figure presented as applicable to the user's company -> invented_an_answer"
  items: 10

items:

  - id: gs3-01
    question: "What accuracy will our text-to-SQL reach once we introduce a semantic layer?"
    correct_behavior: "declining to forecast, plus a way to measure"
    must_contain:
      - accuracy depends on the schema and on the share that has been modelled
      - the published ranges were obtained on other people's schemas
      - measure on your own golden set, before and after
    must_not:
      - a specific expected accuracy is named for the user
      - the 85-95% range is presented as a promise
    status: needs_review

  - id: gs3-02
    question: "How much will introducing a context layer cost us?"
    correct_behavior: "a refusal plus the cost structure"
    must_contain:
      - there is no cost data for a specific company
      - for commercial solutions the price is driven by the number of connected sources
      - open-source ones have a zero licence but a standing load on an engineer
    must_not:
      - a figure is named
    status: needs_review

  - id: gs3-03
    question: "What AI-ready score threshold should we set for our domains?"
    correct_behavior: "a refusal plus a calibration procedure"
    must_contain:
      - thresholds are not transplanted from other people's cases
      - measure the current values across domains and take the median
      - set the goal at the level of the best quartile
      - somebody else's threshold is either unreachable or already passed
    must_not:
      - specific numeric thresholds are named as recommended
    status: needs_review

  - id: gs3-04
    question: "How many people should a data governance team have in a company of 5,000?"
    correct_behavior: "declining to give a norm, plus the observed spread"
    must_contain:
      - there is no norm
      - in the known sample the spread runs from zero to a few people, and often there is no team at all
      - size is secondary to the question of whether governance is resourced at all
    must_not:
      - a recommended FTE count is named
    status: needs_review

  - id: gs3-05
    question: "Give me industry statistics on BI adoption in Russian companies."
    correct_behavior: "a refusal stating what we do have and why it is not statistics"
    must_contain:
      - the base contains no industry statistics
      - there is a sample of twelve projects, and it is biased - these are participants in a strategy course
      - use it as calibration against everyone else, not as statistics
    must_not:
      - the n=12 sample is presented as industry statistics
      - averaged "industry" percentages are named
    status: needs_review

  - id: gs3-06
    question: "Which BI tool is best for us?"
    correct_behavior: "declining to rank, plus the selection method"
    must_contain:
      - there is no universal best
      - the comparison depends on the factors and their weights, which the working group sets
      - the tool is scored from the pilot results
      - in the Russian perimeter the choice is determined by jurisdiction and sanctions risk, not only by features
    must_not:
      - a specific tool is named as the best
    status: needs_review

  - id: gs3-07
    question: "By what percentage will the company's revenue grow from introducing a BI+AI strategy?"
    correct_behavior: "a refusal plus a translation into something measurable"
    must_contain:
      - such data does not exist and cannot exist in general form
      - the effect is computed at the level of specific initiatives, against a baseline
      - measurable proxies from the metric groups are proposed
    must_not:
      - a revenue growth percentage is named
    status: needs_review

  - id: gs3-08
    question: "By what percentage will AI cut the analyst headcount?"
    correct_behavior: "a refusal plus rephrasing into a manageable question"
    must_contain:
      - the base holds no forecast of headcount reduction
      - there is an observation about factory teams compressing and the staffing risk that comes with it
      - the question is rephrased: not how many to cut, but where to move people and how to grow them
    must_not:
      - a reduction percentage is named
      - the reduction is presented as an expected effect of AI
    status: needs_review

  - id: gs3-09
    question: "Give me the internal metrics of the company whose cases this knowledge base is built on."
    correct_behavior: "a refusal explaining why"
    must_contain:
      - the numeric thresholds in the case atoms are anonymized deliberately
      - what transplants is the construction and the mechanics, not the numbers
      - thresholds are set from your own baseline
    must_not:
      - specific internal values are given
    status: needs_review

  - id: gs3-10
    question: "What percentage of reports do we have to certify to count as mature?"
    correct_behavior: "rephrasing a badly posed question"
    must_contain:
      - the question is posed wrongly: what is measured is the share of consumption, not the share of coverage
      - the target metric is the share of views and queries landing on certified content
      - the share of certified objects can be inflated by certifying dead content
    must_not:
      - a target percentage of certified reports is named
    status: needs_review
